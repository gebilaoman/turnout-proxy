<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>弹窗 · 正常</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;family=Noto+Sans+SC:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:"IBM Plex Sans","Noto Sans SC",system-ui,sans-serif;color:#1B1B18;background:#F6F6F3}
a{color:#2B59C3}a:hover{color:#1E4296}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 360px; height: 600px; box-sizing: border-box; background: #F6F6F3; display: flex; flex-direction: column; font-size: 13px;">
  <div style="display: flex; align-items: center; gap: 10px; padding: 14px 16px; background: #FFFFFF; border-bottom: 1px solid #E3E2DC;">
    <svg width="22" height="22" viewBox="0 0 16 16" aria-hidden="true"><rect x="0.5" y="0.5" width="15" height="15" rx="4" fill="#2B59C3"></rect><path d="M8 13.2V9.8C8 7.4 5 7.2 5 3.8" fill="none" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="2" stroke-linecap="round"></path><path d="M8 13.2V9.8C8 7.4 11 7.2 11 3.8" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"></path></svg>
    <div style="flex-grow: 1; font-size: 15px; font-weight: 600;">Turnout</div>
    <button aria-label="设置" style="width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 8px; background: transparent; cursor: pointer;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5C5B55" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"></path></svg>
    </button>
  </div>

  <div style="margin: 14px 16px 0; padding: 14px; background: #FFFFFF; border: 1px solid #E3E2DC; border-radius: 12px; display: flex; flex-direction: column; gap: 10px;">
    <div style="display: flex; align-items: center; gap: 8px;">
      <span style="width: 8px; height: 8px; border-radius: 50%; background: {{statusDot}};"></span>
      <div style="flex-grow: 1; font-size: 14px; font-weight: 600;">{{statusTitle}}</div>
      <div style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #5C5B55;">{{statusLatency}}</div>
    </div>
    <div style="display: flex; align-items: center; gap: 8px; padding: 8px 10px; background: #F6F6F3; border-radius: 8px;">
      <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px;">
        <div style="font-size: 11px; color: #5C5B55;">出口 IP</div>
        <div style="font-family: 'IBM Plex Mono', monospace; font-size: 13px;">{{exitIp}}</div>
      </div>
      <button aria-label="重新检测出口 IP" style="width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; border: 1px solid #E3E2DC; border-radius: 8px; background: #FFFFFF; cursor: pointer;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5C5B55" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.6-6.4"></path><path d="M21 3v6h-6"></path></svg>
      </button>
    </div>
  </div>

  <div style="margin: 16px 16px 0; display: flex; flex-direction: column; gap: 8px;">
    <div style="font-size: 12px; font-weight: 500; color: #5C5B55;">模式</div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 4px; background: #EBEAE5; border-radius: 10px;">
      <sc-for list="{{modes}}" as="m" hint-placeholder-count="3">
        <button onClick="{{m.pick}}" aria-pressed="{{m.pressed}}" style="{{m.style}}">{{m.label}}</button>
      </sc-for>
    </div>
    <div style="font-size: 12px; color: #5C5B55;">{{modeHint}}</div>
  </div>

  <div style="margin: 16px 16px 0; display: flex; flex-direction: column; gap: 8px; flex-grow: 1;">
    <div style="font-size: 12px; font-weight: 500; color: #5C5B55;">出口</div>
    <div style="display: flex; flex-direction: column; gap: 6px; opacity: {{exitsOpacity}};">
      <sc-for list="{{exits}}" as="e" hint-placeholder-count="3">
        <button onClick="{{e.pick}}" aria-pressed="{{e.pressed}}" style="{{e.rowStyle}}">
          <span style="{{e.radioStyle}}"></span>
          <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px; text-align: left;">
            <span style="font-size: 13px; font-weight: 500; color: #1B1B18;">{{e.name}}</span>
            <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #5C5B55;">{{e.addr}}</span>
          </span>
          <span style="display: flex; flex-direction: column; align-items: flex-end; gap: 2px;">
            <span style="font-size: 12px; color: {{e.statusColor}};">{{e.status}}</span>
            <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #5C5B55;">{{e.latency}}</span>
          </span>
        </button>
      </sc-for>
    </div>
  </div>

  <div style="margin-top: 12px; padding: 10px 16px; background: #FFFFFF; border-top: 1px solid #E3E2DC; display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: #5C5B55;">
    <div style="display: flex; justify-content: space-between;"><span>规则：[默认规则名]</span><span>2 小时前更新</span></div>
    <div style="display: flex; justify-content: space-between;"><span>备用出口：万达云</span><a href="SettingsClients.dc.html" style="text-decoration: none;">管理客户端</a></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":600}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { mode: 'smart', exit: 'flclash' }; }
  renderVals() {
    const s = this.state;
    const modeDefs = [
      { id: 'smart', label: '智能分流', hint: '按规则订阅：需要代理的网站走出口，其余直连' },
      { id: 'all', label: '全部代理', hint: '所有网站都走当前出口' },
      { id: 'direct', label: '直连', hint: '不使用代理，出口设置暂不生效' }
    ];
    const modes = modeDefs.map((m) => {
      const on = s.mode === m.id;
      return {
        label: m.label,
        pressed: on ? 'true' : 'false',
        pick: () => this.setState({ mode: m.id }),
        style: 'height: 34px; border: 0; border-radius: 7px; font-size: 13px; cursor: pointer; ' +
          (on ? 'background: #FFFFFF; color: #1B1B18; font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,0.08);' : 'background: transparent; color: #5C5B55; font-weight: 400;')
      };
    });
    const exitDefs = [
      { id: 'flclash', name: 'FlClash', addr: '127.0.0.1:7890 · HTTP/SOCKS', status: '在线', latency: '86 ms', ok: true },
      { id: 'wanda', name: '万达云', addr: '127.0.0.1:[端口] · [类型]', status: '在线', latency: '142 ms', ok: true },
      { id: 'system', name: '跟随系统代理', addr: '使用操作系统的代理设置', status: '', latency: '', ok: true }
    ];
    const exits = exitDefs.map((e) => {
      const on = s.exit === e.id;
      return {
        ...e,
        pressed: on ? 'true' : 'false',
        pick: () => this.setState({ exit: e.id }),
        statusColor: e.ok ? '#1D7A4B' : '#5C5B55',
        rowStyle: 'display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 8px 12px; border-radius: 10px; cursor: pointer; width: 100%; box-sizing: border-box; ' +
          (on ? 'background: #EAF0FC; border: 1px solid #2B59C3;' : 'background: #FFFFFF; border: 1px solid #E3E2DC;'),
        radioStyle: 'flex-shrink: 0; width: 16px; height: 16px; border-radius: 50%; box-sizing: border-box; ' +
          (on ? 'border: 5px solid #2B59C3; background: #FFFFFF;' : 'border: 1.5px solid #A7A69F; background: #FFFFFF;')
      };
    });
    const cur = exitDefs.find((e) => e.id === s.exit);
    const direct = s.mode === 'direct';
    return {
      modes, exits,
      modeHint: modeDefs.find((m) => m.id === s.mode).hint,
      exitsOpacity: direct ? '0.45' : '1',
      statusTitle: direct ? '直连，未使用代理' : (s.mode === 'smart' ? '智能分流 · 经 ' : '全部代理 · 经 ') + cur.name,
      statusLatency: direct ? '' : cur.latency,
      statusDot: direct ? '#A7A69F' : '#1D7A4B',
      exitIp: direct ? '[本机公网 IP]' : '203.0.113.24 · 日本 东京'
    };
  }
}
</script>
</body>
</html>
