<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Logo · 主方案与备选</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=Noto+Sans+SC:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:"IBM Plex Sans","Noto Sans SC",system-ui,sans-serif;color:#1B1B18;background:#F6F6F3}
</style>
</helmet>
<div style="width: 1280px; height: 760px; box-sizing: border-box; background: #F6F6F3; padding: 48px; display: flex; gap: 32px;">

  <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 24px;">
    <div style="flex-grow: 1; background: #FFFFFF; border: 1px solid #E3E2DC; border-radius: 16px; padding: 40px; display: flex; gap: 40px; align-items: center;">
      <svg width="240" height="240" viewBox="0 0 128 128" role="img" aria-label="Turnout 图标">
        <rect x="8" y="8" width="112" height="112" rx="28" fill="#2B59C3"></rect>
        <path d="M64 104V78C64 56 40 54 40 30" fill="none" stroke="#FFFFFF" stroke-opacity="0.38" stroke-width="13" stroke-linecap="round"></path>
        <path d="M64 104V78C64 56 88 54 88 30" fill="none" stroke="#FFFFFF" stroke-width="13" stroke-linecap="round"></path>
      </svg>
      <div style="display: flex; flex-direction: column; gap: 14px;">
        <div style="font-size: 13px; font-weight: 500; color: #2B59C3; letter-spacing: 0.04em;">主方案 · 道岔</div>
        <div style="font-size: 30px; font-weight: 600; line-height: 1.3;">一条入口，扳一下换轨</div>
        <div style="font-size: 15px; color: #5C5B55; line-height: 1.7; max-width: 360px;">底部是唯一入口（一份规则），向上分成两条轨道（两个客户端）。亮的一条是当前出口，暗的一条是备用。切到备用时，亮暗互换——图标本身就是状态指示。</div>
      </div>
    </div>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px;">
      <div style="height: 150px; background: #FFFFFF; border: 1px solid #E3E2DC; border-radius: 16px; display: flex; align-items: center; justify-content: center; gap: 16px;">
        <svg width="64" height="64" viewBox="0 0 128 128" aria-hidden="true">
          <rect x="8" y="8" width="112" height="112" rx="28" fill="#2B59C3"></rect>
          <path d="M64 104V78C64 56 40 54 40 30" fill="none" stroke="#FFFFFF" stroke-opacity="0.38" stroke-width="13" stroke-linecap="round"></path>
          <path d="M64 104V78C64 56 88 54 88 30" fill="none" stroke="#FFFFFF" stroke-width="13" stroke-linecap="round"></path>
        </svg>
        <div style="display: flex; flex-direction: column; gap: 2px;">
          <span style="font-size: 36px; font-weight: 600; letter-spacing: -0.01em; line-height: 1;">Turnout</span>
          <span style="font-size: 14px; color: #5C5B55;">Proxy Switcher</span>
        </div>
      </div>
      <div style="height: 150px; background: #1B1B18; border-radius: 16px; display: flex; align-items: center; justify-content: center; gap: 16px;">
        <svg width="64" height="64" viewBox="0 0 128 128" aria-hidden="true">
          <rect x="8" y="8" width="112" height="112" rx="28" fill="#3D6BE0"></rect>
          <path d="M64 104V78C64 56 40 54 40 30" fill="none" stroke="#FFFFFF" stroke-opacity="0.38" stroke-width="13" stroke-linecap="round"></path>
          <path d="M64 104V78C64 56 88 54 88 30" fill="none" stroke="#FFFFFF" stroke-width="13" stroke-linecap="round"></path>
        </svg>
        <div style="display: flex; flex-direction: column; gap: 2px;">
          <span style="font-size: 36px; font-weight: 600; letter-spacing: -0.01em; line-height: 1; color: #FFFFFF;">Turnout</span>
          <span style="font-size: 14px; color: #B9B8B1;">Proxy Switcher</span>
        </div>
      </div>
    </div>
  </div>

  <div style="width: 340px; display: flex; flex-direction: column; gap: 24px;">
    <div style="font-size: 13px; font-weight: 500; color: #5C5B55;">备选方案</div>
    <div style="flex-grow: 1; background: #FFFFFF; border: 1px solid #E3E2DC; border-radius: 16px; padding: 28px; display: flex; flex-direction: column; gap: 14px;">
      <svg width="112" height="112" viewBox="0 0 128 128" role="img" aria-label="备选 B：拨盘">
        <rect x="8" y="8" width="112" height="112" rx="28" fill="#1B1B18"></rect>
        <path d="M30 78A36 36 0 0 1 98 78" fill="none" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="8" stroke-linecap="round"></path>
        <circle cx="34" cy="56" r="7" fill="#FFFFFF" fill-opacity="0.45"></circle>
        <circle cx="64" cy="40" r="7" fill="#FFFFFF" fill-opacity="0.45"></circle>
        <circle cx="94" cy="56" r="9" fill="#5B8BFF"></circle>
        <path d="M64 92L90 60" fill="none" stroke="#5B8BFF" stroke-width="9" stroke-linecap="round"></path>
        <circle cx="64" cy="92" r="9" fill="#FFFFFF"></circle>
      </svg>
      <div style="font-size: 16px; font-weight: 600;">B · 拨盘</div>
      <div style="font-size: 13px; color: #5C5B55; line-height: 1.6;">指针指向当前出口，多个圆点代表多个客户端。能表达"多选一"，但 16px 下圆点会糊在一起。</div>
    </div>
    <div style="flex-grow: 1; background: #FFFFFF; border: 1px solid #E3E2DC; border-radius: 16px; padding: 28px; display: flex; flex-direction: column; gap: 14px;">
      <svg width="112" height="112" viewBox="0 0 128 128" role="img" aria-label="备选 C：T 字">
        <rect x="8" y="8" width="112" height="112" rx="28" fill="#2B59C3"></rect>
        <path d="M30 40H64" fill="none" stroke="#FFFFFF" stroke-opacity="0.38" stroke-width="14" stroke-linecap="round"></path>
        <path d="M64 40H98" fill="none" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round"></path>
        <path d="M64 42V100" fill="none" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round"></path>
      </svg>
      <div style="font-size: 16px; font-weight: 600;">C · T 字</div>
      <div style="font-size: 13px; color: #5C5B55; line-height: 1.6;">首字母 T，横杠一半亮一半暗表示切换。好认，但"换轨"的含义较弱，也容易和其他 T 字图标撞车。</div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":760}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
