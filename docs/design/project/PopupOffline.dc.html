<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>弹窗 · 客户端离线</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;family=Noto+Sans+SC:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:"IBM Plex Sans","Noto Sans SC",system-ui,sans-serif;color:#1B1B18;background:#F6F6F3}
a{color:#2B59C3}a:hover{color:#1E4296}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 360px; height: 600px; box-sizing: border-box; background: #F6F6F3; display: flex; flex-direction: column; font-size: 13px;">
  <div style="display: flex; align-items: center; gap: 10px; padding: 14px 16px; background: #FFFFFF; border-bottom: 1px solid #E3E2DC;">
    <svg width="22" height="22" viewBox="0 0 16 16" aria-hidden="true"><rect x="0.5" y="0.5" width="15" height="15" rx="4" fill="#B8650A"></rect><path d="M8 13.2V9.8C8 7.4 11 7.2 11 3.8" fill="none" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="2" stroke-linecap="round"></path><path d="M8 13.2V9.8C8 7.4 5 7.2 5 3.8" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"></path></svg>
    <div style="flex-grow: 1; font-size: 15px; font-weight: 600;">Turnout</div>
  </div>

  <div style="margin: 14px 16px 0; padding: 14px; background: #FBF0E1; border: 1px solid #E9C58F; border-radius: 12px; display: flex; flex-direction: column; gap: 10px;">
    <div style="display: flex; align-items: flex-start; gap: 8px;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A85A06" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 1px;"><path d="M12 9v4"></path><path d="M12 17h.01"></path><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"></path></svg>
      <div style="display: flex; flex-direction: column; gap: 4px;">
        <div style="font-size: 14px; font-weight: 600; color: #7A4104;">FlClash 已离线，已自动切到万达云</div>
        <div style="font-size: 12px; color: #6B3A05; line-height: 1.5;">127.0.0.1:7890 无法连接，可能是 FlClash 未运行或端口已修改。FlClash 恢复后不会自动切回。</div>
      </div>
    </div>
    <div style="display: flex; gap: 8px;">
      <button style="flex-grow: 1; height: 34px; border: 1px solid #A85A06; border-radius: 8px; background: #FFFFFF; color: #7A4104; font-size: 13px; font-weight: 500; cursor: pointer;">重新检测 FlClash</button>
      <button style="height: 34px; padding: 0 12px; border: 0; border-radius: 8px; background: transparent; color: #7A4104; font-size: 13px; cursor: pointer;">知道了</button>
    </div>
  </div>

  <div style="margin: 12px 16px 0; padding: 10px 12px; background: #FFFFFF; border: 1px solid #E3E2DC; border-radius: 10px; display: flex; align-items: center; gap: 8px;">
    <span style="width: 8px; height: 8px; border-radius: 50%; background: #1D7A4B;"></span>
    <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px;">
      <div style="font-size: 13px; font-weight: 500;">智能分流 · 经 万达云</div>
      <div style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #5C5B55;">198.51.100.7 · 新加坡</div>
    </div>
    <div style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #5C5B55;">142 ms</div>
  </div>

  <div style="margin: 16px 16px 0; display: flex; flex-direction: column; gap: 6px;">
    <div style="font-size: 12px; font-weight: 500; color: #5C5B55; margin-bottom: 2px;">出口</div>
    <button style="display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 8px 12px; border-radius: 10px; background: #FFFFFF; border: 1px solid #E3E2DC; width: 100%; box-sizing: border-box; cursor: pointer;">
      <span style="flex-shrink: 0; width: 16px; height: 16px; border-radius: 50%; box-sizing: border-box; border: 1.5px solid #A7A69F;"></span>
      <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px; text-align: left;">
        <span style="font-size: 13px; font-weight: 500; color: #5C5B55;">FlClash</span>
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #5C5B55;">127.0.0.1:7890 · HTTP/SOCKS</span>
      </span>
      <span style="display: flex; align-items: center; gap: 4px; font-size: 12px; color: #A85A06;">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#A85A06" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg>离线
      </span>
    </button>
    <button style="display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 8px 12px; border-radius: 10px; background: #EAF0FC; border: 1px solid #2B59C3; width: 100%; box-sizing: border-box; cursor: pointer;">
      <span style="flex-shrink: 0; width: 16px; height: 16px; border-radius: 50%; box-sizing: border-box; border: 5px solid #2B59C3; background: #FFFFFF;"></span>
      <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px; text-align: left;">
        <span style="font-size: 13px; font-weight: 500; color: #1B1B18;">万达云 <span style="font-size: 11px; font-weight: 400; color: #2B59C3;">· 备用</span></span>
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #5C5B55;">127.0.0.1:[端口] · [类型]</span>
      </span>
      <span style="display: flex; flex-direction: column; align-items: flex-end; gap: 2px;">
        <span style="font-size: 12px; color: #1D7A4B;">在线</span>
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #5C5B55;">142 ms</span>
      </span>
    </button>
  </div>

  <div style="margin-top: auto; padding: 10px 16px; background: #FFFFFF; border-top: 1px solid #E3E2DC; font-size: 12px; color: #5C5B55; line-height: 1.5;">
    所有客户端都离线时：<span style="color: #1B1B18; font-weight: 500;">停止访问需代理的网站</span>（不会悄悄直连）
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":600}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
