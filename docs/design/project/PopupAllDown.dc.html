<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>弹窗 · 所有客户端都连不上</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;family=Noto+Sans+SC:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:"IBM Plex Sans","Noto Sans SC",system-ui,sans-serif;color:#1B1B18;background:#F6F6F3}
a{color:#2B59C3}a:hover{color:#1E4296}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 360px; height: 600px; box-sizing: border-box; background: #F6F6F3; display: flex; flex-direction: column; font-size: 13px;">
  <div style="display: flex; align-items: center; gap: 10px; padding: 14px 16px; background: #FFFFFF; border-bottom: 1px solid #E3E2DC;">
    <svg width="22" height="22" viewBox="0 0 16 16" aria-hidden="true"><rect x="0.5" y="0.5" width="15" height="15" rx="4" fill="#B3261E"></rect><g opacity="0.4"><path d="M8 13.2V9.8C8 7.4 5 7.2 5 3.8M8 9.8C8 7.4 11 7.2 11 3.8" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></g></svg>
    <div style="flex-grow: 1; font-size: 15px; font-weight: 600;">Turnout</div>
  </div>

  <div style="margin: 14px 16px 0; padding: 16px; background: #FBEAE8; border: 1px solid #E8B4AE; border-radius: 12px; display: flex; flex-direction: column; gap: 12px;">
    <div style="display: flex; align-items: flex-start; gap: 8px;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#B3261E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 1px;"><path d="M9 7V3"></path><path d="M15 7V3"></path><path d="M6 7h12v4a6 6 0 0 1-6 6 6 6 0 0 1-6-6z"></path><path d="M12 17v4"></path><path d="M3 3l18 18"></path></svg>
      <div style="display: flex; flex-direction: column; gap: 4px;">
        <div style="font-size: 14px; font-weight: 600; color: #8C1D17;">连不上任何代理客户端</div>
        <div style="font-size: 12px; color: #6E1712; line-height: 1.5;">需要代理的网站暂时打不开；其他网站照常直连。为避免暴露真实 IP，不会自动改为直连。</div>
      </div>
    </div>
    <div style="padding: 10px 12px; background: #FFFFFF; border-radius: 8px; display: flex; flex-direction: column; gap: 6px; font-size: 12px; line-height: 1.5;">
      <div style="font-weight: 500;">请检查</div>
      <div style="color: #3D3C38;">1. FlClash、万达云是否已经打开</div>
      <div style="color: #3D3C38;">2. 客户端里的端口是否改过（与下方地址对比）</div>
    </div>
    <div style="display: flex; gap: 8px;">
      <button style="flex-grow: 1; height: 36px; border: 0; border-radius: 8px; background: #B3261E; color: #FFFFFF; font-size: 13px; font-weight: 500; cursor: pointer;">重新检测</button>
      <a href="SettingsClients.dc.html" style="height: 36px; padding: 0 14px; box-sizing: border-box; border: 1px solid #B3261E; border-radius: 8px; background: #FFFFFF; color: #8C1D17; font-size: 13px; display: flex; align-items: center; text-decoration: none;">管理客户端</a>
    </div>
  </div>

  <div style="margin: 16px 16px 0; display: flex; flex-direction: column; gap: 6px;">
    <div style="font-size: 12px; font-weight: 500; color: #5C5B55; margin-bottom: 2px;">出口</div>
    <div style="display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 8px 12px; border-radius: 10px; background: #FFFFFF; border: 1px solid #E3E2DC;">
      <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px;">
        <span style="font-size: 13px; font-weight: 500;">FlClash <span style="font-size: 11px; font-weight: 400; color: #5C5B55;">· 默认</span></span>
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #5C5B55;">127.0.0.1:7890 · HTTP/SOCKS</span>
      </span>
      <span style="display: flex; flex-direction: column; align-items: flex-end; gap: 2px;">
        <span style="font-size: 12px; color: #B3261E;">离线</span>
        <span style="font-size: 11px; color: #5C5B55;">连接被拒绝</span>
      </span>
    </div>
    <div style="display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 8px 12px; border-radius: 10px; background: #FFFFFF; border: 1px solid #E3E2DC;">
      <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px;">
        <span style="font-size: 13px; font-weight: 500;">万达云 <span style="font-size: 11px; font-weight: 400; color: #5C5B55;">· 备用</span></span>
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #5C5B55;">127.0.0.1:[端口] · [类型]</span>
      </span>
      <span style="display: flex; flex-direction: column; align-items: flex-end; gap: 2px;">
        <span style="font-size: 12px; color: #B3261E;">离线</span>
        <span style="font-size: 11px; color: #5C5B55;">无响应（超时）</span>
      </span>
    </div>
  </div>

  <div style="margin-top: auto; padding: 10px 16px; background: #FFFFFF; border-top: 1px solid #E3E2DC; display: flex; align-items: center; gap: 8px; font-size: 12px; color: #5C5B55;">
    <span style="flex-grow: 1; line-height: 1.5;">急用？可临时改为直连（会使用真实 IP）</span>
    <button style="height: 30px; padding: 0 10px; border: 1px solid #D4D3CC; border-radius: 6px; background: #FFFFFF; color: #1B1B18; font-size: 12px; cursor: pointer;">临时直连</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":600}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
